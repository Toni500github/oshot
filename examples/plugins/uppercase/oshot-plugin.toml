[repository]
name = "oshot-examples"
url = "https://github.com/Toni500github/oshot/tree/main/examples/plugins"

[dependencies]
all = ["cmake", "a C compiler"]

[uppercase]
id = "io.github.toni500github.uppercase"
description = "Uppercases the extracted text, an example plugin"
authors = ["Toni500github"]
licenses = ["Unlicense"]
platforms = ["all"]
build-steps = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --config Release",
]
output-dir = "build/out"
