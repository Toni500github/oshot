name: Build/Release oshot

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  MODELS_URL_RAW: "https://github.com/tesseract-ocr/tessdata/raw/main"
  BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Debug' }}

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git tag or commit
        id: get-version
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            version=$(git describe --tags --abbrev=0)
            echo "version=$version" >> $GITHUB_OUTPUT
          else
            version=$(git rev-parse --short HEAD)
            echo "version=commit-$version" >> $GITHUB_OUTPUT
          fi
          echo "Version: $version"

  build:
    name: Build (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux package
          - os: ubuntu-latest
            container:
              image: ghcr.io/toni500github/arch-dev:latest
              options: --user 0
            target: linux
            plugins: false
            artifact-name: linux
            package-file: package/oshot-linux.zip

          - os: ubuntu-latest
            container:
              image: ghcr.io/toni500github/arch-dev:latest
              options: --user 0
            target: linux
            plugins: true
            artifact-name: linux-plugins
            package-file: package/oshot-linux-plugins.zip

          # AppImage package
          - os: ubuntu-22.04
            target: linux-appimage
            plugins: false
            artifact-name: linux-appimage
            package-file: package/oshot-appimage.zip

          - os: ubuntu-22.04
            target: linux-appimage
            plugins: true
            artifact-name: linux-appimage-plugins
            package-file: package/oshot-appimage-plugins.zip

          # Debian package
          - os: ubuntu-22.04
            target: debian-package
            plugins: false
            artifact-name: debian-package
            package-file: package/oshot-debian-package.deb

          - os: ubuntu-22.04
            target: debian-package
            plugins: true
            artifact-name: debian-package-plugins
            package-file: package/oshot-debian-package-plugins.deb

          # macOS aarch64 (arm64) package
          - os: macos-latest
            target: macos-arm64
            plugins: false
            artifact-name: macos-arm64
            package-file: package/oshot-macos-arm64.zip

          - os: macos-latest
            target: macos-arm64
            plugins: true
            artifact-name: macos-arm64-plugins
            package-file: package/oshot-macos-arm64-plugins.zip

          # macOS x86_64 (Intel) package
          - os: macos-15-intel
            target: macos-x86_64
            plugins: false
            artifact-name: macos-x86_64
            package-file: package/oshot-macos-x86_64.zip

          - os: macos-15-intel
            target: macos-x86_64
            plugins: true
            artifact-name: macos-x86_64-plugins
            package-file: package/oshot-macos-x86_64-plugins.zip

          # Windows package
          - os: windows-latest
            target: windows
            plugins: false
            artifact-name: windows
            package-file: package/oshot-windows.zip

          - os: windows-latest
            target: windows
            plugins: true
            artifact-name: windows-plugins
            package-file: package/oshot-windows-plugins.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      # Dependencies
      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            zip \
            libx11 \
            libxcb \
            libpng \
            glfw \
            tesseract \
            zbar \
            libappindicator-gtk3 \
            wayland-protocols \
            wayland-utils \
            wayland

      - name: Install dependencies (AppImage)
        if: matrix.target == 'linux-appimage'
        run: |
          sudo apt-get update && sudo apt-get purge firefox -y
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            make \
            cmake \
            git \
            zip \
            fuse \
            libx11-dev \
            libxcb1-dev \
            libglfw3-dev \
            libtesseract-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libjpeg-dev \
            libgif-dev \
            libtiff-dev \
            libwebp-dev \
            libzbar-dev \
            libappindicator3-dev \
            libwayland-dev \
            wayland-protocols

      - name: Install dependencies (debian-package)
        if: matrix.target == 'debian-package'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            debhelper \
            devscripts \
            cmake \
            libx11-dev \
            libxcb1-dev \
            libglfw3-dev \
            libtesseract-dev \
            libpng-dev \
            libzbar-dev \
            libayatana-appindicator3-dev \
            libwayland-dev \
            wayland-protocols

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update && brew upgrade || true
          brew install cmake glfw tesseract leptonica zbar curl dylibbundler

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            zip
            git
            libcurl-devel
            mingw-w64-x86_64-7zip
            mingw-w64-x86_64-directx-headers
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zbar
            mingw-w64-x86_64-make
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-openjpeg2
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-curl

      # Build
      - name: Build project (Linux)
        if: matrix.target == 'linux' || matrix.target == 'linux-appimage'
        run: |
          ./scripts/generateVersion.sh
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
          cmake --build build

      - name: Build deb package (Linux)
        if: matrix.target == 'debian-package'
        env:
          DISABLE_PLUGINS: ${{ matrix.plugins && '0' || '1' }}
        run: |
          ./scripts/generateVersion.sh
          dpkg-buildpackage -us -uc -b
          mkdir -p package
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          mv ../oshot_*.deb package/oshot-debian-package${SUFFIX}.deb

      - name: Build project (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/generateVersion.sh
          BREW=$(brew --prefix)
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH="$BREW" \
            -DPKG_CONFIG_PATH="$BREW/lib/pkgconfig:$BREW/share/pkgconfig" \
            -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
          cd build && make
          strip -x ./oshot

      - name: Build project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./scripts/generateVersion.sh
          mkdir -p build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DWINDOWS_CMD=OFF -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
          ninja -C build

      # Package
      - name: Package Linux binary
        if: matrix.target == 'linux'
        run: |
          cmake --install build --prefix package/oshot
          find package/oshot -type f \( -executable -o -name '*.so*' \) -exec strip --strip-unneeded {} + 2>/dev/null || true
          printf '#!/bin/bash\ncp -r bin/* /usr/local/bin/\nmkdir -p /usr/local/lib\ncp -r lib/* /usr/local/lib/\n' > package/oshot/install.sh
          chmod +x package/oshot/install.sh
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          cd package && zip -ry oshot-linux${SUFFIX}.zip oshot/

      - name: Package Linux AppImage
        if: matrix.target == 'linux-appimage'
        run: |
          mkdir -p package/oshot/
          ./scripts/create_appimage.sh ./build/oshot oshot-x86_64.AppImage
          chmod +x oshot-x86_64.AppImage
          mv oshot-x86_64.AppImage package/oshot/
          cmake --install build --prefix package/oshot/oshotpm
          rm -f package/oshot/oshotpm/bin/oshot
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          cd package && zip -ry oshot-appimage${SUFFIX}.zip oshot/

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/oshot/models
          ARCH=$(uname -m)
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          ./scripts/create_app_bundle.sh ./build/oshot oshot-macos-${ARCH}.dmg
          mv oshot-macos-${ARCH}.dmg package/oshot/
          cmake --install build --prefix package/oshot/oshotpm
          rm -f package/oshot/oshotpm/bin/oshot
          curl -L $MODELS_URL_RAW/eng.traineddata -o package/oshot/models/eng.traineddata
          cd package && zip -ry oshot-macos-${ARCH}${SUFFIX}.zip oshot/

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          shopt -s nullglob
          mkdir -p package/oshot/models
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          cmake --install build --prefix package/oshot_install
          strip --strip-unneeded package/oshot_install/bin/*.exe package/oshot_install/bin/*.dll
          cp package/oshot_install/bin/*.exe package/oshot_install/bin/*.dll package/oshot/ 2>/dev/null || true
          cp ./oshot.ico package/oshot/
          ldd ./build/oshot.exe | grep -i mingw | awk '{print $3}' | xargs -I {} cp {} package/oshot/ || true
          curl -L $MODELS_URL_RAW/eng.traineddata -o package/oshot/models/eng.traineddata
          cd package && zip -ry oshot-windows${SUFFIX}.zip oshot/

      # Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-package
          path: ${{ matrix.package-file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create GitHub Release & Upload Assets
    needs: [build, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded files
        run: find artifacts/ -type f | sort

      - name: Rename assets to include version tag
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          for f in artifacts/**/*.zip artifacts/**/*.deb; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            base=$(basename "$f" ".$ext")
            dir=$(dirname "$f")
            mv "$f" "$dir/${base}-${VERSION}.${ext}"
          done
          find artifacts/ -type f | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: oshot ${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
