[repository]
name = "oshot-example-cpp"
url = "https://github.com/Toni500github/oshot/tree/main/examples/plugins/cpp"

[dependencies]
all = ["cmake", "a C++20 compiler"]

[uppercase-cpp]
id = "io.github.toni500github.uppercase-cpp"
description = "Uppercases the extracted text, an example plugin in C++"
authors = ["Toni500github"]
licenses = ["Unlicense"]
platforms = ["all"]
build-steps = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --config Release",
]
output-dir = "build/out"
