[repository]
name = "oshot-example-rust"
url = "https://github.com/Toni500github/oshot/tree/main/examples/plugins/rust"

[dependencies]
all = ["cargo and rustc 1.85 or newer", "libclang, for bindgen"]
windows = ["Rust's GNU toolchain and clang (MSYS2's rust and clang packages), not the MSVC ones"]

[uppercase-rust]
id = "io.github.toni500github.uppercase-rust"
description = "Uppercases the extracted text, an example plugin in Rust"
authors = ["Toni500github"]
licenses = ["Unlicense"]
platforms = ["all"]
build-steps = ["cargo build --release --target-dir target"]
output-dir = "target/release"
