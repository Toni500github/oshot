# Flatpak manifest for oshot, without plugin support: plugins are built
# from git with bash and a compiler, which the sandbox doesn't have.
#
# This builds the local checkout. For Flathub, scripts/flathub_manifest.sh
# writes a copy that builds a release tag instead.
#
# Build and install locally, from the repository root:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     --state-dir=build/flatpak-state build/flatpak flatpak/io.github.toni500github.oshot.yml
#   flatpak run io.github.toni500github.oshot
#
# The patches in patches/ come from https://github.com/flathub/shared-modules

id: io.github.toni500github.oshot
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: oshot
# Exported files must be named after the app ID
rename-desktop-file: oshot.desktop
rename-icon: oshot

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Default folder for saved screenshots
  - --filesystem=xdg-pictures
  # OCR model downloader
  - --share=network

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.5.1/glfw-3.5.1.zip
        sha256: ea79bc5feffc254c87291980c2d0bce9acebb68c4983b79f961dcd2cb8a611a0

  # OCR
  - name: leptonica
    config-opts:
      - --disable-static
      - --disable-programs
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7

  - name: tesseract
    config-opts:
      - --disable-static
      - --disable-doc
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
        sha256: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884

  # English model, more languages can be downloaded from oshot
  - name: tessdata-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata/raw/4.1.0/eng.traineddata
        sha256: daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047

  # QR codes and barcodes: only the library
  - name: zbar
    buildsystem: meson
    config-opts:
      - -Dlibrary_type=shared
      - -Ddoc=false
      - -Dvideo=false
      - -Dxshm=disabled
      - -Dxv=disabled
      - -Ddbus=disabled
      - -Dimagemagick=disabled
      - -Dgraphicsmagick=disabled
      - -Dgtk=no
      - -Dgir=false
      - -Dpython=no
      - -Dqt=false
      - -Djava=disabled
      - -Dbuild_tests=false
      - -Dnls=disabled
      - -Dx11=disabled
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/mchehab/zbar/archive/refs/tags/0.23.95.tar.gz
        sha256: 3bad3fe7b8764c6e2131cba91d40e22567a1365352914b62b55247b49124ed33

  # Tray icon, from flathub/shared-modules (libayatana-appindicator-gtk3.json)
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        mirror-urls:
          - https://gstreamer.freedesktop.org/src/mirror/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: patch
        path: patches/intltool-perl5.26-regex-fixes.patch

  - name: libdbusmenu
    build-options:
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    cleanup:
      - /libexec
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        mirror-urls:
          - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      - type: patch
        path: patches/0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_INTROSPECTION=OFF
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4
        commit: f968079b09e2310fefc3fc307359025f1c74b3eb
      - type: patch
        path: patches/0001-Make-introspection-configurable.patch

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    cleanup:
      - /libexec
      - /share
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4
        commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.94
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79

  # Clipboard: oshot runs wl-copy on Wayland and xclip on X11
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  - name: libXmu
    config-opts:
      - --disable-static
      - --disable-docs
    sources:
      - type: archive
        url: https://ftp.x.org/pub/individual/lib/libXmu-1.3.1.tar.xz
        sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4

  - name: xclip
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758

  # File dialogs: tinyfiledialogs runs zenity, whose GTK4 file chooser goes
  # through the FileChooser portal inside the sandbox
  - name: zenity
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
    cleanup:
      - /share/help
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.2/zenity-4.2.2.tar.xz
        sha256: 019186a996096ef4fc356e21577b5673f5baa3a29ac8e3d608b753371c18018d

  - name: oshot
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDISABLE_PLUGINS=ON
    sources:
      # flathub-source-begin: scripts/flathub_manifest.sh replaces this block
      - type: dir
        path: ..
        skip:
          - build
          - .flatpak-builder
      # flathub-source-end
