[repository]
name = "oshot-example-word-boxes"
url = "https://github.com/Toni500github/oshot/tree/main/examples/plugins/word-boxes"

[dependencies]
all = ["cmake", "a C compiler"]

[word-boxes]
id = "io.github.toni500github.word-boxes"
description = "Draws the OCR word boxes on the overlay and fits the selection to them, an example plugin"
authors = ["Toni500github"]
licenses = ["Unlicense"]
platforms = ["all"]
build-steps = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --config Release",
]
output-dir = "build/out"
