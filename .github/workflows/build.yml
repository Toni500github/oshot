name: Build/Release oshot

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: 1
  # Oldest macOS the macOS packages run on. It must match the runners' macOS,
  # as that's what the bundled Homebrew libraries are built for
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  MODELS_URL_RAW: "https://github.com/tesseract-ocr/tessdata/raw/main"
  BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Debug' }}

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from git tag or commit
        id: get-version
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            version=$(git describe --tags --abbrev=0)
            echo "version=$version" >> $GITHUB_OUTPUT
          else
            version=$(git rev-parse --short HEAD)
            echo "version=commit-$version" >> $GITHUB_OUTPUT
          fi
          echo "Version: $version"

  build:
    timeout-minutes: 30
    name: Build (${{ matrix.artifact-name }})
    needs: get-version
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux package. Arch Linux's container image only exists for x86_64
          - os: ubuntu-latest
            container:
              image: ghcr.io/toni500github/arch-dev:latest
              options: --user 0
            target: linux
            arch: x86_64
            plugins: false
            artifact-name: linux-x86_64
            package-file: package/oshot-linux-x86_64.zip

          - os: ubuntu-latest
            container:
              image: ghcr.io/toni500github/arch-dev:latest
              options: --user 0
            target: linux
            arch: x86_64
            plugins: true
            artifact-name: linux-x86_64-plugins
            package-file: package/oshot-linux-x86_64-plugins.zip

          # AppImage package (arch: uname -m, as in AppImage names)
          - os: ubuntu-22.04
            target: linux-appimage
            arch: x86_64
            plugins: false
            artifact-name: linux-appimage-x86_64
            package-file: |
              package/oshot-x86_64*.AppImage
              package/oshot-x86_64*.AppImage.zsync

          - os: ubuntu-22.04
            target: linux-appimage
            arch: x86_64
            plugins: true
            artifact-name: linux-appimage-x86_64-plugins
            package-file: |
              package/oshot-x86_64-plugins*.AppImage
              package/oshot-x86_64-plugins*.AppImage.zsync

          - os: ubuntu-22.04-arm
            target: linux-appimage
            arch: aarch64
            plugins: false
            artifact-name: linux-appimage-aarch64
            package-file: |
              package/oshot-aarch64*.AppImage
              package/oshot-aarch64*.AppImage.zsync

          - os: ubuntu-22.04-arm
            target: linux-appimage
            arch: aarch64
            plugins: true
            artifact-name: linux-appimage-aarch64-plugins
            package-file: |
              package/oshot-aarch64-plugins*.AppImage
              package/oshot-aarch64-plugins*.AppImage.zsync

          # Debian package (arch: dpkg --print-architecture)
          - os: ubuntu-22.04
            target: debian-package
            arch: amd64
            plugins: false
            artifact-name: debian-package-amd64
            package-file: package/oshot-debian-package-amd64.deb

          - os: ubuntu-22.04
            target: debian-package
            arch: amd64
            plugins: true
            artifact-name: debian-package-amd64-plugins
            package-file: package/oshot-debian-package-amd64-plugins.deb

          - os: ubuntu-22.04-arm
            target: debian-package
            arch: arm64
            plugins: false
            artifact-name: debian-package-arm64
            package-file: package/oshot-debian-package-arm64.deb

          - os: ubuntu-22.04-arm
            target: debian-package
            arch: arm64
            plugins: true
            artifact-name: debian-package-arm64-plugins
            package-file: package/oshot-debian-package-arm64-plugins.deb

          # macOS aarch64 (arm64) package. Homebrew's bottles are built for the
          # runner's macOS, so the runner sets the oldest macOS oshot runs on
          - os: macos-15
            target: macos
            arch: arm64
            plugins: false
            artifact-name: macos-arm64
            package-file: package/oshot-macos-arm64.dmg

          - os: macos-15
            target: macos
            arch: arm64
            plugins: true
            artifact-name: macos-arm64-plugins
            package-file: package/oshot-macos-arm64-plugins.dmg

          # macOS x86_64 (Intel) package
          - os: macos-15-intel
            target: macos
            arch: x86_64
            plugins: false
            artifact-name: macos-x86_64
            package-file: package/oshot-macos-x86_64.dmg

          - os: macos-15-intel
            target: macos
            arch: x86_64
            plugins: true
            artifact-name: macos-x86_64-plugins
            package-file: package/oshot-macos-x86_64-plugins.dmg

          # Windows package. MSYS2 has no GCC for ARM64, so it's built with
          # its clang environment (libc++ instead of libstdc++)
          - os: windows-latest
            target: windows
            arch: x64
            msystem: MINGW64
            plugins: false
            artifact-name: windows-x64
            package-file: |
              package/oshot-windows-x64.zip
              package/oshot-windows-x64-setup.exe

          - os: windows-latest
            target: windows
            arch: x64
            msystem: MINGW64
            plugins: true
            artifact-name: windows-x64-plugins
            package-file: |
              package/oshot-windows-x64-plugins.zip
              package/oshot-windows-x64-plugins-setup.exe

          - os: windows-11-arm
            target: windows
            arch: arm64
            msystem: CLANGARM64
            plugins: false
            artifact-name: windows-arm64
            package-file: |
              package/oshot-windows-arm64.zip
              package/oshot-windows-arm64-setup.exe

          - os: windows-11-arm
            target: windows
            arch: arm64
            msystem: CLANGARM64
            plugins: true
            artifact-name: windows-arm64-plugins
            package-file: |
              package/oshot-windows-arm64-plugins.zip
              package/oshot-windows-arm64-plugins-setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      # Dependencies
      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            base-devel \
            cmake \
            zip \
            libx11 \
            libxcb \
            libpng \
            tesseract \
            zbar \
            libappindicator-gtk3 \
            wayland-protocols \
            wayland-utils \
            wayland \
            libxkbcommon \
            libxrandr \
            libxinerama \
            libxcursor \
            libxi

      - name: Install dependencies (AppImage)
        if: matrix.target == 'linux-appimage'
        run: |
          sudo apt-get update && sudo apt-get purge firefox -y
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            make \
            cmake \
            git \
            zip \
            fuse \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libtesseract-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libjpeg-dev \
            libgif-dev \
            libtiff-dev \
            libwebp-dev \
            libzbar-dev \
            libappindicator3-dev \
            libwayland-dev \
            wayland-protocols

      - name: Install dependencies (debian-package)
        if: matrix.target == 'debian-package'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            debhelper \
            devscripts \
            cmake \
            libx11-dev \
            libxcb1-dev \
            libglfw3-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libtesseract-dev \
            libpng-dev \
            libzbar-dev \
            libayatana-appindicator3-dev \
            libwayland-dev \
            wayland-protocols

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --formula --force-bottle \
            cmake \
            glfw \
            tesseract \
            leptonica \
            zbar \
            curl \
            dylibbundler

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            zip
            git
            libcurl-devel
          # :p adds the environment's package prefix (mingw-w64-x86_64-, mingw-w64-clang-aarch64-)
          pacboy: >-
            7zip:p
            directx-headers:p
            ninja:p
            toolchain:p
            minizip:p
            cmake:p
            zbar:p
            make:p
            tesseract-ocr:p
            glfw:p
            libpng:p
            libjpeg-turbo:p
            openjpeg2:p
            libwebp:p
            libtiff:p
            curl:p

      # Build
      # Distro GLFW is X11-only on Ubuntu 22.04 (3.3) and depends on the host for the
      # zip: link a static GLFW with X11 and Wayland, so oshot never needs XWayland
      - name: Build GLFW with X11 and Wayland (Linux)
        if: matrix.target == 'linux' || matrix.target == 'linux-appimage' || matrix.target == 'debian-package'
        run: ./scripts/build_glfw.sh /usr/local

      - name: Build project (Linux)
        if: matrix.target == 'linux' || matrix.target == 'linux-appimage'
        run: |
          ./scripts/generateVersion.sh
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }} \
            -Dglfw3_DIR=/usr/local/lib/cmake/glfw3
          cmake --build build
          # The static GLFW must be the one linked in, not a system libglfw
          if ldd build/oshot | grep libglfw; then echo "oshot links a shared libglfw" >&2; exit 1; fi

      - name: Build deb package (Linux)
        if: matrix.target == 'debian-package'
        env:
          DISABLE_PLUGINS: ${{ matrix.plugins && '0' || '1' }}
          GLFW3_DIR: /usr/local/lib/cmake/glfw3
        run: |
          ./scripts/generateVersion.sh
          dpkg-buildpackage -us -uc -b
          mkdir -p package
          DEB=package/oshot-debian-package-${{ matrix.arch }}${{ matrix.plugins && '-plugins' || '' }}.deb
          mv ../oshot_*_${{ matrix.arch }}.deb "$DEB"
          # The static GLFW must be the one linked in, not Ubuntu's X11-only libglfw3
          if dpkg-deb -f "$DEB" Depends | grep libglfw; then
            echo "the .deb depends on libglfw3" >&2; exit 1
          fi

      - name: Build project (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/generateVersion.sh
          BREW=$(brew --prefix)
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH="$BREW" \
            -DPKG_CONFIG_PATH="$BREW/lib/pkgconfig:$BREW/share/pkgconfig" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
          cd build && make
          strip -x ./oshot

      - name: Build project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./scripts/generateVersion.sh
          mkdir -p build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
          ninja -C build

      # Package
      - name: Package Linux binary
        if: matrix.target == 'linux'
        run: |
          cmake --install build --prefix package/oshot
          find package/oshot -type f \( -executable -o -name '*.so*' \) -exec strip --strip-unneeded {} + 2>/dev/null || true
          cp scripts/install-linux-zip.sh package/oshot/install.sh
          chmod +x package/oshot/install.sh
          cd package && zip -ry oshot-linux-${{ matrix.arch }}${{ matrix.plugins && '-plugins' || '' }}.zip oshot/

      - name: Package Linux AppImage
        if: matrix.target == 'linux-appimage'
        env:
          OSHOT_VERSION: ${{ needs.get-version.outputs.version }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Published as is: the plugin build bundles oshotpm and its libraries inside
          NAME=oshot-${{ matrix.arch }}${{ matrix.plugins && '-plugins' || '' }}
          if [ "$IS_RELEASE" = true ]; then
            # Update information points AppImageUpdate at the .zsync of the same variant
            # in the latest release. The .zsync names the AppImage, so it gets its final
            # name here and the release job doesn't rename it
            export UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|latest|${NAME}-v*.AppImage.zsync"
            NAME="${NAME}-${OSHOT_VERSION}"
          fi
          mkdir -p package/
          ./scripts/create_appimage.sh ./build/oshot "package/${NAME}.AppImage"
          chmod +x "package/${NAME}.AppImage"

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        env:
          OSHOT_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p package models
          SUFFIX=$([ "${{ matrix.plugins }}" == "true" ] && echo "-plugins" || echo "")
          curl -fL $MODELS_URL_RAW/eng.traineddata -o models/eng.traineddata
          # Tagged builds get the tag; branch builds keep the script's default version
          case "$OSHOT_VERSION" in v*) ;; *) unset OSHOT_VERSION ;; esac
          export OSHOT_MODELS_DIR="$PWD/models"
          # Fail if a bundled library needs a newer macOS than MACOSX_DEPLOYMENT_TARGET
          export OSHOT_MIN_MACOS="$MACOSX_DEPLOYMENT_TARGET"
          if [ "${{ matrix.plugins }}" == "true" ]; then
            export OSHOT_EXTRA_BINS="$PWD/build/oshotpm"
            export OSHOT_EXTRA_LIBS="$PWD/build/libcimgui.dylib"
          fi
          ./scripts/create_app_bundle.sh ./build/oshot package/oshot-macos-${{ matrix.arch }}${SUFFIX}.dmg ./build

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          shopt -s nullglob
          mkdir -p package/oshot/models
          cmake --install build --prefix package/oshot_install
          # The clang environments have llvm's binutils, which may only exist under their llvm- names
          STRIP=$(command -v strip || command -v llvm-strip)
          "$STRIP" --strip-unneeded package/oshot_install/bin/*.exe package/oshot_install/bin/*.dll
          cp package/oshot_install/bin/*.exe package/oshot_install/bin/*.dll package/oshot/
          cp ./assets/windows/oshot.ico package/oshot/
          # Every DLL that oshot, oshotpm and their DLLs need from the MSYS2 environment
          ./scripts/bundle_windows_dlls.sh package/oshot
          curl -fL $MODELS_URL_RAW/eng.traineddata -o package/oshot/models/eng.traineddata
          cd package && zip -ry oshot-windows-${{ matrix.arch }}${{ matrix.plugins && '-plugins' || '' }}.zip oshot/

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OSHOT_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Tagged builds get the tag, branch builds the version from CMakeLists.txt
          if ($env:OSHOT_VERSION -like 'v*') {
            $version = $env:OSHOT_VERSION.TrimStart('v')
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'project\(oshot VERSION ([0-9.]+)'
            $version = $m.Matches[0].Groups[1].Value + '-dev'
          }
          $numVersion = ($version -split '-')[0]
          $suffix = if ('${{ matrix.plugins }}' -eq 'true') { '-plugins' } else { '' }
          & $iscc /Qp "/DAppVersion=$version" "/DAppNumVersion=$numVersion" "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=..\package\oshot" "/DOutputName=oshot-windows-${{ matrix.arch }}$suffix-setup" scripts\oshot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}-package
          path: ${{ matrix.package-file }}
          if-no-files-found: error

  # Build-only check that oshot still compiles on the BSDs, nothing is packaged
  build-freebsd:
    timeout-minutes: 45
    name: Build (freebsd${{ matrix.plugins && '-plugins' || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugins: [false, true]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y \
              git \
              cmake \
              pkgconf \
              glfw \
              tesseract \
              zbar \
              gtk3 \
              libappindicator \
              dbus \
              libX11 \
              libXrandr \
              mesa-libs \
              wayland \
              wayland-protocols
          run: |
            set -e
            git config --global --add safe.directory '*'
            ./scripts/generateVersion.sh
            cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDISABLE_PLUGINS=${{ matrix.plugins && '0' || '1' }}
            cmake --build build --parallel "$(sysctl -n hw.ncpu)"
            cmake --install build --prefix "$PWD/stage"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Create GitHub Release & Upload Assets
    needs: [build, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: List downloaded files
        run: find artifacts/ -type f | sort

      - name: Rename assets to include version tag
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          shopt -s globstar nullglob
          for f in artifacts/**/*.zip artifacts/**/*.deb artifacts/**/*.dmg artifacts/**/*.exe artifacts/**/*.AppImage; do
            [ -f "$f" ] || continue
            # Already named by its build job (the AppImages, see their .zsync)
            case "$(basename "$f")" in *"-${VERSION}."*) continue ;; esac
            ext="${f##*.}"
            base=$(basename "$f" ".$ext")
            dir=$(dirname "$f")
            mv "$f" "$dir/${base}-${VERSION}.${ext}"
          done
          find artifacts/ -type f | sort

      - name: Write release notes
        run: ./scripts/release_notes.sh "${{ needs.get-version.outputs.version }}" > release_notes.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: oshot ${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
